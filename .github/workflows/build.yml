name: Build and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'engine/**'
      - 'shared/**'
      - 'mod/**'
      - 'fpsgame/**'
      - 'ircbot/**'
      - 'GeoIP/**'
      - 'enet/**'
      - 'sqlite/**'
      - 'config/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev libgeoip-dev zip

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install cmake sqlite3 zip

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            base-devel
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-geoip
            mingw-w64-x86_64-zlib
            zip

      # 2. Build Project (Windows)
      - name: Build Project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja
          cmake --build build --config Release --parallel 4

      # 3. Build Project (Unix)
      - name: Build Project (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build
          cmake --build build --config Release --parallel 4

      # 4. Package Release
      - name: Package Release
        shell: bash
        run: |
          mkdir -p release_bundle/GeoIP
          
          # Handle OS-specific executable extension
          EXE=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXE=".exe"; fi
          
          cp build/qserv$EXE release_bundle/
          cp GeoIP/*.dat release_bundle/GeoIP/
          cp -r config/ release_bundle/
          cp stats-webserver.py release_bundle/
          
          zip -r qserv-${{ runner.os }}.zip release_bundle/

      # 5. Upload
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: qserv-${{ runner.os }}.zip
          tag_name: latest
          body: "Automated build of QServ."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
