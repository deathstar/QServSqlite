name: Build and Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      # 1. Install Linux Dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libsqlite3-dev zlib1g-dev libgeoip-dev
        
      # 2. Install macOS Dependencies
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install cmake sqlite3

      # 3. Setup MSYS2 (Windows)
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-libgeoip

      # 4. Build Project (Windows)
      - name: Build Project (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build
          cmake --build build --config Release

      # 5. Build Project (Unix)
      - name: Build Project (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build
          cmake --build build --config Release

      # 6. Package
      - name: Package Release
        shell: bash
        run: |
          mkdir release_bundle
          
          # Copy Binary
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp build/qserv.exe release_bundle/
          else
            cp build/qserv release_bundle/
          fi
          
          # Copy Data Files
          mkdir -p release_bundle/GeoIP
          cp QServSqlite/GeoIP/GeoIP.dat release_bundle/GeoIP/
          cp QServSqlite/GeoIP/GeoLiteCity.dat release_bundle/GeoIP/
          
          # Copy Config
          cp -r config/ release_bundle/
          
          # Create Zip
          zip -r qserv-${{ runner.os }}.zip release_bundle/

      # 7. Upload
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          files: qserv-${{ runner.os }}.zip
          tag_name: latest
          body: "Automated build of QServ."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
